name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

  unit-test:
    name: Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  smoke-test:
    name: CLI Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: version
        run: node bin/index.js --version

      - name: help
        run: node bin/index.js --help

      - name: list
        run: node bin/index.js list

      - name: templates
        run: node bin/index.js templates

      - name: build --help
        run: node bin/index.js build --help

      - name: doctor
        run: node bin/index.js doctor
        continue-on-error: true

      - name: CI mode scaffold (Next.js, no install)
        run: node bin/index.js build smoke-test --yes --no-install --no-git --template nextjs
        env:
          CI: '1'

      - name: Verify scaffold output exists (Unix)
        if: runner.os != 'Windows'
        run: test -f smoke-test/package.json

      - name: Verify scaffold output exists (Windows)
        if: runner.os == 'Windows'
        run: if not exist smoke-test\package.json exit 1
        shell: cmd

      - name: Cleanup (Unix)
        if: always() && runner.os != 'Windows'
        run: rm -rf smoke-test

      - name: Cleanup (Windows)
        if: always() && runner.os == 'Windows'
        run: if exist smoke-test rmdir /s /q smoke-test
        shell: cmd

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, unit-test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run integration tests
        run: npm run test:integration
        timeout-minutes: 10
